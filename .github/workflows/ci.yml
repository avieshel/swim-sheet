name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: client/dist
          retention-days: 1

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: client/dist
      - name: Deploy to Cloudflare Pages
        uses: kitabisa/cloudflare-pages-action@v2
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project-name: swim-sheet
          build-directory: client/dist
          branch: main
          production-branch: main


  deploy-supabase:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_OWNER_USER_IDS: ${{ secrets.SUPABASE_OWNER_USER_IDS }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy admin-coach-assist Edge Function
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase secrets not configured; skipping deploy."
            exit 0
          fi
          supabase functions deploy admin-coach-assist --project-ref "$SUPABASE_PROJECT_REF"
      - name: Sync OWNER_USER_IDS secret
        run: |
          if [ -z "$SUPABASE_OWNER_USER_IDS" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "OWNER_USER_IDS or project ref not configured; skipping."
            exit 0
          fi
          supabase secrets set OWNER_USER_IDS="$SUPABASE_OWNER_USER_IDS" --project-ref "$SUPABASE_PROJECT_REF"
