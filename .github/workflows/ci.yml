name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Check migration filename uniqueness
        working-directory: ${{ github.workspace }}
        run: node utils/check-migration-filenames.mjs
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: client/dist
          retention-days: 1

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: client/dist
      - name: Deploy to Cloudflare Pages
        uses: kitabisa/cloudflare-pages-action@v2
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project-name: swim-sheet
          build-directory: client/dist
          branch: main
          production-branch: main


  deploy-supabase:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_OWNER_USER_IDS: ${{ secrets.SUPABASE_OWNER_USER_IDS }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy admin-coach-assist Edge Function
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase secrets not configured; skipping deploy."
            exit 0
          fi
          supabase functions deploy admin-coach-assist --project-ref "$SUPABASE_PROJECT_REF"
      - name: Sync OWNER_USER_IDS secret
        run: |
          if [ -z "$SUPABASE_OWNER_USER_IDS" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "OWNER_USER_IDS or project ref not configured; skipping."
            exit 0
          fi
          supabase secrets set OWNER_USER_IDS="$SUPABASE_OWNER_USER_IDS" --project-ref "$SUPABASE_PROJECT_REF"


  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check for unapplied migrations on hosted
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase secrets not configured; skipping migration check."
            exit 0
          fi
          set +e
          output=$(supabase db push --remote --dry-run 2>&1)
          rc=$?
          echo "$output"
          if [ $rc -ne 0 ]; then
            echo "::error::supabase db push --dry-run failed (rc=$rc)."
            exit 1
          fi
          json_line=$(echo "$output" | grep -o '{.*}' | head -n 1)
          if [ -z "$json_line" ]; then
            echo "::warning::Could not parse dry-run output; skipping."
            exit 0
          fi
          node -e '
            const d = JSON.parse(process.argv[1]);
            const pending = d.upToDate !== true || (Array.isArray(d.migrations) && d.migrations.length > 0);
            if (pending) {
              console.error("::error::Hosted DB is behind local migrations. Apply them with: supabase db push --remote");
              if (Array.isArray(d.migrations)) d.migrations.forEach((m) => console.error("  pending:", m));
              process.exit(1);
            }
            console.log("Hosted DB is up to date with local migrations.");
          ' "$json_line"
