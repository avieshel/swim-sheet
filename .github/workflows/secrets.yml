name: Secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The pre-commit hook only guards the author's machine, and only when it is
  # installed and run. This is the backstop for --no-verify, a missing hook, or
  # a secret that arrives some other way.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # trufflehog git mode needs full history, not just the tip.
          fetch-depth: 0

      # 1. Content scan across every commit, not just the working tree.
      - name: TruffleHog (history)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

      # 2. Type-based guard, run against the tree as it would be committed.
      #    Complements the content scan: a pg_dump has no recognisable secret
      #    pattern but is still unsafe to track.
      #    Uses a temp index so the checkout is left untouched.
      - name: Reject sensitive file types
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/ci-index"
          git read-tree HEAD
          git add -A
          ./utils/check-sensitive-files.sh --staged

  # Belt and braces: assert the things that must never be tracked are not.
  guard-denylist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no env/dump/key files are tracked
        run: |
          tracked=$(git ls-files)
          echo "$tracked" | grep -Ei '(^|/)(\.env($|\.)|[^/]*\.(pem|key|p12|pfx|jks|keystore|kdbx)$|id_rsa|id_ed25519|\.npmrc|\.netrc)$' \
            && { echo "::error::tracked secret-bearing file(s) above"; exit 1; } \
            || echo "✅ no tracked env/key/dump files"

      - name: Assert SQL files only live under supabase/
        run: |
          stray=$(git ls-files '*.sql' | grep -Ev '^supabase/(migrations|migrations_archive|tests)/|^supabase/seed\.sql$' || true)
          if [ -n "$stray" ]; then
            echo "::error::SQL outside supabase/ — dumps must go to .local-utils/ (gitignored):"
            echo "$stray"
            exit 1
          fi
          echo "✅ SQL files are all schema/fixtures"

  # The transport maps local Dexie table names to Postgres names. An unmapped or
  # misspelled name makes PostgREST return 404, which the sync path used to
  # discard — so the table silently never synced. Static check, no DB required.
  table-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node utils/check-cloud-table-names.mjs